<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <!-- Ilustrasi latar hero: kanopi daun gelap dengan cahaya yang menembus. Ganti dengan foto di public/img/hero.jpg. -->
  <defs>
    <radialGradient id="glow" cx="70%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3d5a12"/>
      <stop offset=".55" stop-color="#14300b"/>
      <stop offset="1" stop-color="#061405"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <path id="leaf" d="M0 0 C 40 -60 140 -70 200 0 C 140 70 40 60 0 0 Z"/>
  </defs>
  <rect width="1600" height="700" fill="url(#glow)"/>
  <g filter="url(#blur)" opacity=".85">
    <circle cx="1180" cy="210" r="90" fill="#c9a227"/>
    <circle cx="1320" cy="420" r="70" fill="#e0b93a"/>
    <circle cx="1050" cy="520" r="110" fill="#6f8f1e"/>
    <circle cx="300" cy="160" r="80" fill="#4f7a00"/>
    <circle cx="520" cy="560" r="120" fill="#2f5210"/>
    <circle cx="820" cy="120" r="60" fill="#8fae2a"/>
    <circle cx="1480" cy="120" r="70" fill="#5e7f18"/>
  </g>
  <g fill="#0d2508" opacity=".9" filter="url(#soft)">
    <use href="#leaf" transform="translate(-40 120) rotate(15) scale(1.6)"/>
    <use href="#leaf" transform="translate(60 520) rotate(-25) scale(1.9)"/>
    <use href="#leaf" transform="translate(1380 640) rotate(-150) scale(1.7)"/>
    <use href="#leaf" transform="translate(1560 260) rotate(170) scale(1.5)"/>
  </g>
  <g fill="#2c4d0e" opacity=".75">
    <use href="#leaf" transform="translate(980 640) rotate(-60) scale(1.1)"/>
    <use href="#leaf" transform="translate(240 380) rotate(-10) scale(.9)"/>
    <use href="#leaf" transform="translate(1250 90) rotate(140) scale(.8)"/>
  </g>
  <g stroke="#0d2508" stroke-width="6" opacity=".8" fill="none">
    <path d="M1000 700 C 1020 560 1100 470 1240 420"/>
    <path d="M0 470 C 140 430 220 380 280 300"/>
  </g>
</svg>
